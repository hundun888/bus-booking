<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公车预约管理系统 — 桂林山水职业学院</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1a5276;
  --primary-light: #2980b9;
  --primary-bg: #ebf5fb;
  --accent: #e67e22;
  --danger: #e74c3c;
  --success: #27ae60;
  --success-light: #d4edda;
  --gray: #95a5a6;
  --border: #d5e8f0;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 10px;
}
body {
  font-family: -apple-system, 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: #f0f4f8;
  color: #2c3e50;
  padding: 20px;
  min-height: 100vh;
}
/* ── 顶部横幅 ── */
.header {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff;
  padding: 20px 28px;
  border-radius: var(--radius);
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  box-shadow: var(--shadow);
}
.header h1 { font-size: 22px; letter-spacing: 2px; }
.header h1 small { font-size: 13px; font-weight: 400; opacity: .75; margin-left: 8px; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.card {
  background: #fff;
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  margin-bottom: 18px;
}
.card h2 {
  font-size: 17px;
  color: var(--primary);
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--primary-bg);
  display: flex;
  align-items: center;
  gap: 8px;
}
/* ── 车辆状态面板 ── */
.car-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.car-card {
  padding: 18px;
  border-radius: var(--radius);
  border: 3px solid var(--border);
  transition: all .3s;
  position: relative;
}
.car-card.available { border-color: var(--success); background: #eafaf1; }
.car-card.in-use { border-color: var(--danger); background: #fdedec; animation: pulse 2s infinite; }
.car-card.upcoming { border-color: var(--accent); background: #fef9e7; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.85; } }
.car-card .car-name { font-size: 17px; font-weight: 700; }
.car-card .car-plate { font-size: 13px; color: #666; margin-top: 2px; }
.car-card .car-status {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  margin-top: 8px;
}
.car-status.avail { background: var(--success); color: #fff; }
.car-status.busy { background: var(--danger); color: #fff; }
.car-status.wait { background: var(--accent); color: #fff; }
.car-card .car-detail { margin-top: 8px; font-size: 13px; color: #555; line-height: 1.6; }
.car-card .car-detail strong { color: #333; }
/* ── 布局网格 ── */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1.6fr;
  gap: 18px;
  margin-bottom: 18px;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 14px;
  margin-bottom: 10px;
}
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group.full { grid-column: 1 / -1; }
.form-group label { font-size: 13px; font-weight: 600; color: #555; }
.form-group label .req { color: var(--danger); margin-left: 2px; }
.form-group input, .form-group select, .form-group textarea {
  padding: 8px 10px;
  border: 1px solid #d0d7de;
  border-radius: 6px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border .2s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(41,128,185,.15);
}
.carpool-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.carpool-grid input { padding: 6px 8px; font-size: 13px; }
.btn-group { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.btn {
  padding: 8px 18px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
  display: inline-flex; align-items: center; gap: 5px;
}
.btn-primary { background: var(--primary-light); color: #fff; }
.btn-primary:hover { background: var(--primary); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #219a52; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #c0392b; }
.btn-warning { background: var(--accent); color: #fff; }
.btn-warning:hover { background: #d35400; }
.btn-outline { background: transparent; color: var(--primary-light); border: 1.5px solid var(--primary-light); }
.btn-outline:hover { background: var(--primary-bg); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
/* ── 看板 ── */
.board-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}
.board-filters { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.board-filters select, .board-filters input[type="date"] {
  padding: 5px 8px;
  border: 1px solid #d0d7de;
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  outline: none;
}
.board-table-wrap { overflow-x: auto; }
.board-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 900px;
}
.board-table th {
  background: var(--primary);
  color: #fff;
  padding: 9px 7px;
  text-align: center;
  font-weight: 600;
  white-space: nowrap;
  position: sticky; top: 0;
}
.board-table td {
  padding: 8px 7px;
  border-bottom: 1px solid var(--border);
  text-align: center;
  vertical-align: middle;
}
.board-table tr:hover td { background: #f7fbff; }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}
.badge-aion { background: #d4edda; color: #155724; }
.badge-wm { background: #d1ecf1; color: #0c5460; }
.badge-status { background: #fff3cd; color: #856404; }
.badge-returned { background: #d4edda; color: #155724; }
.badge-cancel { background: #f8d7da; color: #721c24; }
.empty-msg { text-align: center; padding: 30px 20px; color: var(--gray); font-size: 14px; }
.empty-msg span { font-size: 36px; display: block; margin-bottom: 8px; }
/* ── Toast ── */
.toast-container {
  position: fixed; top: 16px; right: 16px; z-index: 9999;
  display: flex; flex-direction: column; gap: 6px;
}
.toast {
  padding: 10px 18px;
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,.15);
  animation: slideIn .3s ease, fadeOut .3s ease 2.7s forwards;
  max-width: 360px;
}
.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }
.toast-info { background: var(--primary-light); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; transform: translateX(50px); } }
/* ── 弹窗 ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.4);
  display: none; align-items: center; justify-content: center;
  z-index: 10000; backdrop-filter: blur(2px);
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: #fff; border-radius: 12px;
  padding: 24px 28px; max-width: 420px; width: 90%;
  box-shadow: 0 10px 40px rgba(0,0,0,.2);
  text-align: center;
}
.modal-box h3 { font-size: 17px; margin-bottom: 8px; }
.modal-box p { color: #666; font-size: 14px; margin-bottom: 16px; line-height: 1.6; }
.modal-box .btn-group { justify-content: center; }
/* ── 管理面板 ── */
.admin-section {
  display: none;
  border: 2px solid var(--accent);
  background: #fffef5;
}
.admin-section.visible { display: block; }
.admin-login-bar {
  display: flex; gap: 8px; align-items: center;
  padding: 10px 14px;
  background: var(--primary);
  color: #fff;
  border-radius: 6px;
  margin-bottom: 10px;
}
.admin-login-bar input {
  padding: 6px 10px;
  border: none;
  border-radius: 4px;
  font-size: 13px;
  outline: none;
  width: 160px;
}
.admin-badge {
  background: var(--accent);
  color: #fff;
  padding: 2px 10px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
}
.admin-actions { display: flex; gap: 6px; flex-wrap: wrap; }
/* ── 数据加载 ── */
.loading { text-align: center; padding: 20px; color: var(--gray); }
.loading .spinner {
  display: inline-block;
  width: 24px; height: 24px;
  border: 3px solid var(--border);
  border-top-color: var(--primary-light);
  border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* ── 响应式 ── */
@media (max-width: 900px) {
  .grid-2 { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .car-grid { grid-template-columns: 1fr; }
  body { padding: 12px; }
  .header { padding: 14px 16px; }
  .header h1 { font-size: 17px; }
}
@media (max-width: 600px) {
  .board-controls { flex-direction: column; align-items: stretch; }
  .board-table { font-size: 12px; min-width: 700px; }
}
</style>
</head>
<body>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<!-- 确认弹窗 -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <h3>⚠️ 确认操作</h3>
    <p id="confirmMsg">确定要执行此操作吗？</p>
    <div class="btn-group">
      <button class="btn btn-outline" onclick="closeConfirm()">取消</button>
      <button class="btn btn-danger" id="confirmBtn">确认</button>
    </div>
  </div>
</div>

<!-- 管理登录弹窗 -->
<div class="modal-overlay" id="adminLoginModal">
  <div class="modal-box">
    <h3>🔐 管理员登录</h3>
    <p>请输入管理员密码</p>
    <input type="password" id="adminPwdInput" placeholder="请输入密码"
      style="width:100%;padding:10px;border:1px solid #d0d7de;border-radius:6px;font-size:16px;text-align:center;margin-bottom:14px;outline:none;">
    <div class="btn-group" style="justify-content:center;">
      <button class="btn btn-outline" onclick="closeAdminLogin()">取消</button>
      <button class="btn btn-primary" onclick="doAdminLogin()">登录</button>
    </div>
    <p style="margin-top:10px;font-size:12px;color:#999;">默认密码: admin123（可自行修改）</p>
  </div>
</div>

<!-- 顶部 -->
<div class="header">
  <div>
    <h1>🚗 公车预约管理系统 <small>桂林山水职业学院</small></h1>
    <div class="sub" style="margin-top:4px;font-size:13px;opacity:.8;">云端实时 · 在线预约 · 智能调度</div>
  </div>
  <div class="header-actions">
    <button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:#fff;" onclick="showAdminLogin()">🔑 管理</button>
    <span style="font-size:12px;opacity:.7;">联勤保障部</span>
  </div>
</div>

<!-- 车辆状态面板 -->
<div class="card" style="margin-bottom:18px;">
  <h2>🚦 车辆实时状态</h2>
  <div class="car-grid" id="carStatusGrid">
    <div class="loading" style="grid-column:1/-1;"><div class="spinner"></div> 加载中...</div>
  </div>
</div>

<div class="grid-2">
  <!-- 预约表单 -->
  <div class="card">
    <h2>📝 预约登记</h2>
    <form id="bookingForm" autocomplete="off">
      <div class="form-row">
        <div class="form-group full">
          <label>选择车辆 <span class="req">*</span></label>
          <select id="vehicle" required>
            <option value="">— 请选择 —</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>用车时间 <span class="req">*</span></label>
          <input type="datetime-local" id="useTime" required>
        </div>
        <div class="form-group">
          <label>预计还车时间 <span class="req">*</span></label>
          <input type="datetime-local" id="returnTime" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label>目的地 <span class="req">*</span></label>
          <input type="text" id="destination" placeholder="例：桂林市教育局、车管所等" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>借车人 <span class="req">*</span></label>
          <input type="text" id="borrower" placeholder="姓名" required>
        </div>
        <div class="form-group">
          <label>驾驶员 <span class="req">*</span></label>
          <input type="text" id="driver" placeholder="姓名" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label>驾驶员手机号 <span class="req">*</span></label>
          <input type="tel" id="driverPhone" placeholder="11 位手机号码" required pattern="1\d{10}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label>拼车人 <span style="font-weight:400;color:#999;">（最多 4 人，留空即可）</span></label>
          <div class="carpool-grid">
            <input type="text" id="carpool1" placeholder="拼车人 1">
            <input type="text" id="carpool2" placeholder="拼车人 2">
            <input type="text" id="carpool3" placeholder="拼车人 3">
            <input type="text" id="carpool4" placeholder="拼车人 4">
          </div>
        </div>
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary">📌 提交预约</button>
        <button type="button" class="btn btn-outline" onclick="resetForm()">🔄 清空</button>
      </div>
    </form>
  </div>

  <!-- 统计 -->
  <div class="card">
    <h2>📊 今日概况</h2>
    <div id="statsArea" style="font-size:14px;">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<!-- 看板 -->
<div class="card">
  <h2>📋 预约公示看板</h2>
  <div class="board-controls">
    <div class="board-filters">
      <select id="filterVehicle">
        <option value="">全部车辆</option>
      </select>
      <input type="date" id="filterDate">
      <button class="btn btn-sm btn-outline" onclick="applyFilters()">🔍 筛选</button>
      <button class="btn btn-sm btn-outline" onclick="clearFilters()">✕ 清除</button>
    </div>
    <div class="right" style="display:flex;gap:6px;">
      <button class="btn btn-sm btn-success" onclick="exportXlsx()">📥 导出</button>
    </div>
  </div>
  <div class="board-table-wrap">
    <table class="board-table">
      <thead>
        <tr>
          <th>序号</th>
          <th>车辆</th>
          <th>用车时间</th>
          <th>预计还车</th>
          <th>目的地</th>
          <th>借车人</th>
          <th>驾驶员</th>
          <th>手机</th>
          <th>拼车人</th>
          <th>状态</th>
          <th class="admin-only" id="adminColHead" style="display:none;">操作</th>
        </tr>
      </thead>
      <tbody id="boardBody"></tbody>
    </table>
  </div>
  <div id="emptyMsg" class="empty-msg" style="display:none;">
    <span>📭</span> 暂无预约记录
  </div>
  <div style="text-align:right;margin-top:10px;font-size:12px;color:#999;">
    共 <span id="recordCount">0</span> 条记录
  </div>
</div>

<!-- 管理面板 -->
<div class="card admin-section" id="adminSection">
  <h2>🔐 管理面板 <span class="admin-badge">管理员</span></h2>

  <!-- 管理员工具栏 -->
  <div class="admin-login-bar">
    <span>👤 已登录管理员</span>
    <button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:#fff;" onclick="logoutAdmin()">退出登录</button>
    <button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:#fff;" onclick="exportAllXlsx()">📦 导出全部</button>
    <button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:#fff;" onclick="showVehicleManager()">🚗 车辆管理</button>
  </div>

  <!-- 车辆管理 -->
  <div id="vehicleManager" style="display:none;margin-bottom:14px;padding:14px;background:#fff;border-radius:8px;border:1px solid var(--border);">
    <h3 style="font-size:15px;margin-bottom:8px;">🚗 车辆管理</h3>
    <div id="vehicleList" style="margin-bottom:8px;"></div>
    <div style="display:flex;gap:6px;">
      <input type="text" id="newVehicleName" placeholder="车辆名称（如：比亚迪）" style="flex:1;padding:6px 8px;border:1px solid #d0d7de;border-radius:4px;font-size:13px;">
      <input type="text" id="newVehiclePlate" placeholder="车牌号（如：桂C00000）" style="flex:1;padding:6px 8px;border:1px solid #d0d7de;border-radius:4px;font-size:13px;">
      <button class="btn btn-sm btn-success" onclick="addVehicle()">➕ 添加</button>
    </div>
  </div>

  <!-- 预约管理表格 -->
  <div class="board-table-wrap">
    <table class="board-table">
      <thead>
        <tr>
          <th>序号</th>
          <th>车辆</th>
          <th>用车时间</th>
          <th>还车时间</th>
          <th>目的地</th>
          <th>借车人</th>
          <th>驾驶员</th>
          <th>手机</th>
          <th>状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="adminBoardBody"></tbody>
    </table>
  </div>
</div>

<script>
// ============================================================
//  Supabase 配置
// ============================================================
const SUPABASE_URL = 'https://nxegqjrkhueorihtdwkp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_li8adaR4h24zGTzMnXmdfw_JxvfZNfu';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================
//  车辆列表（管理员可修改）
// ============================================================
let VEHICLES = [
  { label: '埃安 桂CD31783', type: 'aion' },
  { label: '威马 桂CD56337', type: 'wm' },
];

// ============================================================
//  管理员密码（可在源码中修改）
// ============================================================
const ADMIN_PASSWORD = 'admin123';
let isAdmin = false;

// ============================================================
//  数据操作
// ============================================================
async function getRecords() {
  const { data, error } = await sb.from('bookings').select('*').order('use_time', { ascending: false });
  if (error) { console.error('Supabase query error:', error); return []; }
  return data || [];
}

async function addRecord(record) {
  // 处理 carpool 字段
  const payload = {
    vehicle: record.vehicle,
    use_time: record.useTime,
    return_time: record.returnTime,
    destination: record.destination,
    borrower: record.borrower,
    driver: record.driver,
    driver_phone: record.driverPhone,
    carpool: record.carpool || [],
    status: '已预约',
  };
  const { error } = await sb.from('bookings').insert([payload]);
  if (error) throw error;
}

async function deleteRecord(id) {
  const { error } = await sb.from('bookings').delete().eq('id', id);
  if (error) throw error;
}

async function updateRecordStatus(id, status) {
  const { error } = await sb.from('bookings').update({ status }).eq('id', id);
  if (error) throw error;
}

// 本地车辆管理（存在 localStorage）
function getVehicles() {
  try { return JSON.parse(localStorage.getItem('gs_vehicles')) || VEHICLES; }
  catch { return VEHICLES; }
}
function saveVehicles(arr) {
  localStorage.setItem('gs_vehicles', JSON.stringify(arr));
}

// ============================================================
//  Toast
// ============================================================
function toast(msg, type = 'success') {
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ============================================================
//  确认弹窗
// ============================================================
let confirmCallback = null;
function openConfirm(msg, cb) {
  document.getElementById('confirmMsg').textContent = msg;
  document.getElementById('confirmModal').classList.add('show');
  confirmCallback = cb;
}
function closeConfirm() {

// ============================================================
//  车辆实时状态面板
// ============================================================
async function renderCarStatus() {
  const records = await getRecords();
  const now = new Date();
  const vehicles = getVehicles();

  const grid = document.getElementById('carStatusGrid');
  grid.innerHTML = vehicles.map(v => {
    // 查询该车的当前使用情况
    const inUse = records.filter(r => {
      if (r.vehicle !== v.label) return false;
      const start = new Date(r.use_time);
      const end = new Date(r.return_time);
      return start <= now && end >= now && r.status !== '已归还' && r.status !== '已取消';
    });

    // 查询即将用车（今天内）
    const todayEnd = new Date(now);
    todayEnd.setHours(23, 59, 59, 999);
    const upcoming = records.filter(r => {
      if (r.vehicle !== v.label) return false;
      const start = new Date(r.use_time);
      return start > now && start <= todayEnd && r.status !== '已归还' && r.status !== '已取消';
    });

    let statusClass = 'available';
    let statusText = '✅ 当前可用';
    let detailHtml = '';

    if (inUse.length > 0) {
      statusClass = 'in-use';
      const r = inUse[0];
      statusText = '🔴 使用中';
      const endTime = new Date(r.return_time);
      detailHtml = `
        <div class="car-detail">
          <strong>借车人：</strong>${escHtml(r.borrower)}<br>
          <strong>驾驶员：</strong>${escHtml(r.driver)}<br>
          <strong>预计还车：</strong>${formatDt(r.return_time)}<br>
          <strong>目的地：</strong>${escHtml(r.destination)}
        </div>
      `;
    } else if (upcoming.length > 0) {
      statusClass = 'upcoming';
      statusText = '🟡 即将用车';
      const r = upcoming[0];
      detailHtml = `
        <div class="car-detail">
          <strong>下次预约：</strong>${formatDt(r.use_time)}<br>
          <strong>借车人：</strong>${escHtml(r.borrower)}<br>
          <strong>目的地：</strong>${escHtml(r.destination)}
        </div>
      `;
    }

    const parts = v.label.split(' ');
    const name = parts[0] || v.label;
    const plate = parts[1] || '';

    return `
      <div class="car-card ${statusClass}">
        <div class="car-name">🚗 ${escHtml(name)}</div>
        <div class="car-plate">${escHtml(plate)}</div>
        <div class="car-status ${statusClass === 'available' ? 'avail' : statusClass === 'in-use' ? 'busy' : 'wait'}">${statusText}</div>
        ${detailHtml}
      </div>
    `;
  }).join('');
}

// ============================================================
//  渲染看板
// ============================================================
async function renderBoard() {
  let records = await getRecords();
  const fV = document.getElementById('filterVehicle').value;
  const fD = document.getElementById('filterDate').value;

  if (fV) records = records.filter(r => r.vehicle === fV);
  if (fD) {
    records = records.filter(r => {
      const d = new Date(r.use_time);
      return d.toISOString().slice(0,10) === fD;
    });
  }

  records.sort((a,b) => new Date(b.use_time) - new Date(a.use_time));

  const tbody = document.getElementById('boardBody');
  const empty = document.getElementById('emptyMsg');
  const count = document.getElementById('recordCount');

  if (records.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    count.textContent = '0';
    return;
  }
  empty.style.display = 'none';
  count.textContent = records.length;

  tbody.innerHTML = records.map((r, i) => {
    const vType = r.vehicle.startsWith('埃安') ? 'aion' : 'wm';
    const badgeClass = vType === 'aion' ? 'badge-aion' : 'badge-wm';
    const carpoolStr = safeCarpool(r.carpool).join('、') || '—'

    // 检查是否超时
    let statusHtml = '';
    if (r.status === '已归还' || r.status === '已完成') {
      statusHtml = `<span class="badge badge-returned">${r.status}</span>`;
    } else if (r.status === '已取消') {
      statusHtml = `<span class="badge badge-cancel">已取消</span>`;
    } else if (new Date(r.return_time) < new Date() && r.status !== '已归还') {
      statusHtml = `<span class="badge badge-cancel">⚠️ 超时未还</span>`;
    } else {
      statusHtml = `<span class="badge badge-status">${r.status}</span>`;
    }

    const adminDelBtn = isAdmin
      ? `<button class="del-btn" onclick="adminDeleteRecord('${r.id}')" title="删除" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;padding:2px 6px;">✕</button>
         <button class="btn btn-sm btn-success" onclick="adminCompleteRecord('${r.id}')" style="font-size:11px;padding:2px 6px;">✓</button>`
      : '';

    return `<tr>
      <td>${i + 1}</td>
      <td><span class="badge ${badgeClass}">${escHtml(r.vehicle)}</span></td>
      <td>${formatDt(r.use_time)}</td>
      <td>${formatDt(r.return_time)}</td>
      <td>${escHtml(r.destination)}</td>
      <td>${escHtml(r.borrower)}</td>
      <td>${escHtml(r.driver)}</td>
      <td>${escHtml(r.driver_phone || '')}</td>
      <td style="font-size:12px;">${escHtml(carpoolStr)}</td>
      <td>${statusHtml}</td>
      <td class="${isAdmin ? '' : 'admin-only'}" style="${isAdmin ? '' : 'display:none;'}">
        <div class="admin-actions" style="justify-content:center;">
          ${adminDelBtn}
        </div>
      </td>
    </tr>`;
  }).join('');
}

async function renderStats() {
  const records = await getRecords();
  const now = new Date();

  const today = now.toISOString().slice(0,10);
  const todayRecords = records.filter(r => new Date(r.use_time).toISOString().slice(0,10) === today);

  const inUse = records.filter(r => {
    if (r.status === '已归还' || r.status === '已取消') return false;
    const start = new Date(r.use_time);
    const end = new Date(r.return_time);
    return start <= now && end >= now;
  });

  const overdue = records.filter(r => {
    if (r.status === '已归还' || r.status === '已取消') return false;
    return new Date(r.return_time) < now;
  });

  document.getElementById('statsArea').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center;">
      <div style="background:var(--primary-bg);padding:10px;border-radius:8px;">
        <div style="font-size:22px;font-weight:700;color:var(--primary);">${todayRecords.length}</div>
        <div style="font-size:12px;color:#666;">今日预约</div>
      </div>
      <div style="background:#fef9e7;padding:10px;border-radius:8px;">
        <div style="font-size:22px;font-weight:700;color:var(--accent);">${inUse.length}</div>
        <div style="font-size:12px;color:#666;">当前在用</div>
      </div>
      <div style="background:${overdue.length > 0 ? '#fdedec' : '#eafaf1'};padding:10px;border-radius:8px;">
        <div style="font-size:22px;font-weight:700;color:${overdue.length > 0 ? 'var(--danger)' : 'var(--success)'};">${overdue.length}</div>
        <div style="font-size:12px;color:#666;">超时未还</div>
      </div>
    </div>
    <div style="margin-top:10px;padding:8px;background:#f8f9fa;border-radius:6px;font-size:12px;color:#666;text-align:center;">
      🚗 ${getVehicles().length} 辆车 &nbsp;|&nbsp; 共 ${records.length} 条总记录
    </div>
  `;
}

// ============================================================

document.getElementById('bookingForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const vehicle    = document.getElementById('vehicle').value;
  const useTime    = document.getElementById('useTime').value;
  const returnTime = document.getElementById('returnTime').value;
  const destination = document.getElementById('destination').value.trim();
  const borrower   = document.getElementById('borrower').value.trim();
  const driver     = document.getElementById('driver').value.trim();
  const driverPhone = document.getElementById('driverPhone').value.trim();
  const carpool = [
    document.getElementById('carpool1').value.trim(),
    document.getElementById('carpool2').value.trim(),
    document.getElementById('carpool3').value.trim(),
    document.getElementById('carpool4').value.trim(),
  ].filter(Boolean);

  if (!vehicle) { toast('请选择车辆', 'error'); return; }
  if (!useTime) { toast('请选择用车时间', 'error'); return; }
  if (!returnTime) { toast('请选择预计还车时间', 'error'); return; }
  if (new Date(returnTime) <= new Date(useTime)) {
    toast('还车时间必须晚于用车时间', 'error'); return;
  }
  if (!destination) { toast('请输入目的地', 'error'); return; }
  if (!borrower) { toast('请输入借车人姓名', 'error'); return; }
  if (!driver) { toast('请输入驾驶员姓名', 'error'); return; }
  if (!/^1\d{10}$/.test(driverPhone)) { toast('请输入正确的11位手机号码', 'error'); return; }

  // 冲突检测
  const records = await getRecords();
  const conflict = records.some(r => {
    if (r.vehicle !== vehicle) return false;
    if (r.status === '已归还' || r.status === '已取消') return false;
    const rStart = new Date(r.use_time).getTime();
    const rEnd   = new Date(r.return_time).getTime();
    const nStart = new Date(useTime).getTime();
    const nEnd   = new Date(returnTime).getTime();
    return nStart < rEnd && nEnd > rStart;
  });
  if (conflict) {
    toast(`⚠️ "${vehicle}" 在该时段已有预约`, 'error');
    return;
  }

  try {
    await addRecord({
      vehicle, useTime, returnTime, destination,
      borrower, driver, driverPhone, carpool
    });
    toast('✅ 预约成功！');
    resetForm();
    await refreshAll();
  } catch (err) {
    toast('❌ 提交失败：' + err.message, 'error');
  }
});

function resetForm() {
  document.getElementById('bookingForm').reset();
  document.getElementById('useTime').value = '';
  document.getElementById('returnTime').value = '';
}

function showVehicleManager() {
  const vm = document.getElementById('vehicleManager');
  vm.style.display = vm.style.display === 'none' ? 'block' : 'none';
  if (vm.style.display === 'block') renderVehicleList();
}

function renderVehicleList() {
  const vehicles = getVehicles();
  const list = document.getElementById('vehicleList');
  list.innerHTML = vehicles.map((v, i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee;">
      <span style="flex:1;font-size:14px;">🚗 ${escHtml(v.label)}</span>
      <button class="btn btn-sm btn-danger" onclick="removeVehicle(${i})">移除</button>
    </div>
  `).join('');
}

function addVehicle() {
  const name = document.getElementById('newVehicleName').value.trim();
  const plate = document.getElementById('newVehiclePlate').value.trim();
  if (!name) { toast('请输入车辆名称', 'error'); return; }
  if (!plate) { toast('请输入车牌号', 'error'); return; }

  const label = `${name} ${plate}`;
  const vehicles = getVehicles();
  vehicles.push({ label, type: 'custom' });
  saveVehicles(vehicles);
  renderVehicleList();
  document.getElementById('newVehicleName').value = '';
  document.getElementById('newVehiclePlate').value = '';
  refreshVehicleSelect();
  toast('✅ 已添加车辆');
}

function removeVehicle(index) {
  openConfirm('确定要移除该车辆吗？', function() {
    const vehicles = getVehicles();
    vehicles.splice(index, 1);
    saveVehicles(vehicles);
    renderVehicleList();
    refreshVehicleSelect();
    toast('已移除');
  });
}

function refreshVehicleSelect() {
  const vehicles = getVehicles();
  const selects = ['vehicle', 'filterVehicle'];
  selects.forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    const val = sel.value;
    sel.innerHTML = `<option value="">${id === 'vehicle' ? '— 请选择 —' : '全部车辆'}</option>`;
    vehicles.forEach(v => {
      sel.innerHTML += `<option value="${escHtml(v.label)}">🚗 ${escHtml(v.label)}</option>`;
    });
    sel.value = val;
  });
}

function safeCarpool(carpool) {
  if (Array.isArray(carpool)) return carpool;
  if (typeof carpool === 'string') {
    try {
      const parsed = JSON.parse(carpool);
      return Array.isArray(parsed) ? parsed : [];
    } catch { return carpool ? [carpool] : []; }
  }
  if (carpool == null) return [];
  return [];
}
// ============================================================
function formatDt(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function escHtml(s) {
  if (s == null) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ============================================================
//  导出 Excel
// ============================================================
async function exportXlsx() {
  const records = await getRecords();
  if (records.length === 0) { toast('暂无记录', 'info'); return; }
  doExport(records, '车辆预约记录');
}

async function exportAllXlsx() {
  const records = await getRecords();
  if (records.length === 0) { toast('暂无记录', 'info'); return; }
  doExport(records, '全部车辆预约记录');
}

function doExport(data, sheetName) {
  const rows = data.map((r, i) => ({
    '序号': i + 1,
    '车辆': r.vehicle,
    '用车时间': r.use_time ? new Date(r.use_time).toLocaleString('zh-CN', { hour12: false }) : '',
    '预计还车时间': r.return_time ? new Date(r.return_time).toLocaleString('zh-CN', { hour12: false }) : '',
    '目的地': r.destination,
    '借车人': r.borrower,
    '驾驶员': r.driver,
    '驾驶员手机': r.driver_phone || '',
    '拼车人': safeCarpool(r.carpool).join('、'),
    '状态': r.status,
    '创建时间': r.created_at ? new Date(r.created_at).toLocaleString('zh-CN', { hour12: false }) : '',
  }));

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [
    { wch:5 }, { wch:16 }, { wch:18 }, { wch:18 },
    { wch:20 }, { wch:10 }, { wch:10 }, { wch:14 },
    { wch:20 }, { wch:8 }, { wch:18 },
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);

  const now = new Date();
  const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  XLSX.writeFile(wb, `公车预约记录_${stamp}.xlsx`);
  toast(`📥 已导出`);
}
