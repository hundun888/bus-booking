<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公车预约管理系统 — 桂林山水职业学院</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1a5276;
  --primary-light: #2980b9;
  --primary-bg: #ebf5fb;
  --accent: #e67e22;
  --danger: #e74c3c;
  --success: #27ae60;
  --gray: #95a5a6;
  --border: #d5e8f0;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 10px;
}
body {
  font-family: -apple-system, 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: #f0f4f8;
  color: #2c3e50;
  padding: 20px;
  min-height: 100vh;
}
/* ── 顶部横幅 ── */
.header {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff;
  padding: 28px 32px;
  border-radius: var(--radius);
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  box-shadow: var(--shadow);
}
.header h1 { font-size: 24px; letter-spacing: 2px; }
.header h1 small { font-size: 14px; font-weight: 400; opacity: .75; margin-left: 10px; }
.header .sub {
  font-size: 14px; opacity: .85;
  display: flex; align-items: center; gap: 6px;
}
/* ── 布局网格 ── */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1.6fr;
  gap: 20px;
  margin-bottom: 20px;
}
.card {
  background: #fff;
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.card h2 {
  font-size: 18px;
  color: var(--primary);
  margin-bottom: 18px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--primary-bg);
  display: flex;
  align-items: center;
  gap: 8px;
}
/* ── 表单 ── */
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 16px;
  margin-bottom: 12px;
}
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group.full { grid-column: 1 / -1; }
.form-group label {
  font-size: 13px;
  font-weight: 600;
  color: #555;
}
.form-group label .req { color: var(--danger); margin-left: 2px; }
.form-group input,
.form-group select {
  padding: 8px 12px;
  border: 1px solid #d0d7de;
  border-radius: 6px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border .2s;
}
.form-group input:focus,
.form-group select:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(41,128,185,.15); }

/* 拼车人 */
.carpool-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.carpool-grid input { padding: 6px 10px; font-size: 13px; }

/* 按钮 */
.btn-group { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.btn {
  padding: 9px 22px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: var(--primary-light); color: #fff; }
.btn-primary:hover { background: var(--primary); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #219a52; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #c0392b; }
.btn-warning { background: var(--accent); color: #fff; }
.btn-warning:hover { background: #d35400; }
.btn-outline { background: transparent; color: var(--primary-light); border: 1.5px solid var(--primary-light); }
.btn-outline:hover { background: var(--primary-bg); }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* ── 看板表格 ── */
.board-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
}
.board-controls .right { display: flex; gap: 8px; flex-wrap: wrap; }
.board-filters {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.board-filters select,
.board-filters input[type="date"] {
  padding: 6px 10px;
  border: 1px solid #d0d7de;
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  outline: none;
}
.board-filters select:focus,
.board-filters input[type="date"]:focus { border-color: var(--primary-light); }

.empty-msg {
  text-align: center;
  padding: 40px 20px;
  color: var(--gray);
  font-size: 15px;
}
.empty-msg span { font-size: 40px; display: block; margin-bottom: 10px; }

/* 表格 */
.board-table-wrap { overflow-x: auto; }
.board-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 900px;
}
.board-table th {
  background: var(--primary);
  color: #fff;
  padding: 10px 8px;
  text-align: center;
  font-weight: 600;
  white-space: nowrap;
  position: sticky; top: 0;
}
.board-table td {
  padding: 9px 8px;
  border-bottom: 1px solid var(--border);
  text-align: center;
  vertical-align: middle;
}
.board-table tr:hover td { background: #f7fbff; }
.board-table .badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}
.badge-aion { background: #d4edda; color: #155724; }
.badge-wm { background: #d1ecf1; color: #0c5460; }
.badge-status { background: #fff3cd; color: #856404; }
.badge-returned { background: #d4edda; color: #155724; }

.board-table .del-btn {
  background: none;
  border: none;
  color: var(--danger);
  cursor: pointer;
  font-size: 16px;
  padding: 3px 8px;
  border-radius: 4px;
  transition: all .2s;
}
.board-table .del-btn:hover {
  background: #fde8e8;
  transform: scale(1.15);
}

/* ── Toast ── */
.toast-container {
  position: fixed; top: 20px; right: 20px; z-index: 9999;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  padding: 12px 20px;
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,.15);
  animation: slideIn .3s ease, fadeOut .3s ease 2.7s forwards;
  max-width: 380px;
}
.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }
.toast-info { background: var(--primary-light); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; transform: translateX(50px); } }

/* ── 弹窗确认 ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.4);
  display: none; align-items: center; justify-content: center;
  z-index: 10000;
  backdrop-filter: blur(2px);
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: #fff; border-radius: 12px;
  padding: 28px 32px; max-width: 400px; width: 90%;
  box-shadow: 0 10px 40px rgba(0,0,0,.2);
  text-align: center;
}
.modal-box h3 { font-size: 18px; margin-bottom: 10px; }
.modal-box p { color: #666; font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
.modal-box .btn-group { justify-content: center; }

/* ── 响应式 ── */
@media (max-width: 900px) {
  .grid-2 { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .carpool-grid { grid-template-columns: 1fr; }
  body { padding: 12px; }
  .header { padding: 18px 20px; }
  .header h1 { font-size: 18px; }
}
@media (max-width: 600px) {
  .board-controls { flex-direction: column; align-items: stretch; }
  .board-filters { flex-wrap: wrap; }
  .board-table { font-size: 12px; min-width: 700px; }
}
</style>
</head>
<body>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<!-- 确认弹窗 -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <h3>⚠️ 确认删除</h3>
    <p id="confirmMsg">确定要删除这条预约记录吗？此操作不可撤销。</p>
    <div class="btn-group">
      <button class="btn btn-outline" onclick="closeConfirm()">取消</button>
      <button class="btn btn-danger" id="confirmBtn">确认删除</button>
    </div>
  </div>
</div>

<!-- 顶部 -->
<div class="header">
  <div>
    <h1>🚗 公车预约管理系统 <small>桂林山水职业学院</small></h1>
    <div class="sub" style="margin-top:6px;">📋 在线预约 · 实时公示 · 便捷管理</div>
  </div>
  <div class="sub">联勤保障部 · 车辆调度中心</div>
</div>

<div class="grid-2">
  <!-- 左侧：预约表单 -->
  <div class="card">
    <h2>📝 预约登记</h2>
    <form id="bookingForm" autocomplete="off">
      <div class="form-row">
        <div class="form-group full">
          <label>选择车辆 <span class="req">*</span></label>
          <select id="vehicle" required>
            <option value="">— 请选择 —</option>
            <option value="埃安 桂CD31783">🚗 埃安 · 桂CD31783</option>
            <option value="威马 桂CD56337">🚙 威马 · 桂CD56337</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>用车时间 <span class="req">*</span></label>
          <input type="datetime-local" id="useTime" required>
        </div>
        <div class="form-group">
          <label>预计还车时间 <span class="req">*</span></label>
          <input type="datetime-local" id="returnTime" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label>目的地 <span class="req">*</span></label>
          <input type="text" id="destination" placeholder="例：桂林市教育局、车管所等" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>借车人 <span class="req">*</span></label>
          <input type="text" id="borrower" placeholder="姓名" required>
        </div>
        <div class="form-group">
          <label>驾驶员 <span class="req">*</span></label>
          <input type="text" id="driver" placeholder="姓名" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label>驾驶员手机号 <span class="req">*</span></label>
          <input type="tel" id="driverPhone" placeholder="11 位手机号码" required pattern="1\d{10}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label>拼车人 <span style="font-weight:400;color:#999;">（最多 4 人，留空即可）</span></label>
          <div class="carpool-grid">
            <input type="text" id="carpool1" placeholder="拼车人 1">
            <input type="text" id="carpool2" placeholder="拼车人 2">
            <input type="text" id="carpool3" placeholder="拼车人 3">
            <input type="text" id="carpool4" placeholder="拼车人 4">
          </div>
        </div>
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary">📌 提交预约</button>
        <button type="button" class="btn btn-outline" onclick="resetForm()">🔄 清空表单</button>
      </div>
    </form>
  </div>

  <!-- 右侧：使用统计 -->
  <div class="card">
    <h2>📊 车辆使用概况</h2>
    <div id="statsArea" style="font-size:14px;">加载中...</div>

    <!-- 车辆状态小卡 -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;">
      <div id="statAion" style="padding:14px;border-radius:8px;background:#eafaf1;border:1px solid #d5f5e3;">
        <div style="font-weight:700;font-size:15px;">🚗 埃安 · 桂CD31783</div>
        <div style="color:#666;font-size:13px;margin-top:4px;" id="statAionInfo">近期预约：0 次</div>
      </div>
      <div id="statWm" style="padding:14px;border-radius:8px;background:#e8f8f5;border:1px solid #d1f2eb;">
        <div style="font-weight:700;font-size:15px;">🚙 威马 · 桂CD56337</div>
        <div style="color:#666;font-size:13px;margin-top:4px;" id="statWmInfo">近期预约：0 次</div>
      </div>
    </div>
  </div>
</div>

<!-- 看板 -->
<div class="card">
  <h2>📋 车辆预约公示看板</h2>
  <div class="board-controls">
    <div class="board-filters">
      <select id="filterVehicle">
        <option value="">全部车辆</option>
        <option value="埃安 桂CD31783">埃安 · 桂CD31783</option>
        <option value="威马 桂CD56337">威马 · 桂CD56337</option>
      </select>
      <input type="date" id="filterDate">
      <button class="btn btn-sm btn-outline" onclick="applyFilters()">🔍 筛选</button>
      <button class="btn btn-sm btn-outline" onclick="clearFilters()">✕ 清除</button>
    </div>
    <div class="right">
      <button class="btn btn-sm btn-success" onclick="exportXlsx()">📥 导出 Excel</button>
      <button class="btn btn-sm btn-warning" onclick="exportAllXlsx()">📦 导出全部</button>
    </div>
  </div>

  <div class="board-table-wrap">
    <table class="board-table">
      <thead>
        <tr>
          <th>序号</th>
          <th>车辆</th>
          <th>用车时间</th>
          <th>预计还车</th>
          <th>目的地</th>
          <th>借车人</th>
          <th>驾驶员</th>
          <th>驾驶员手机</th>
          <th>拼车人</th>
          <th>状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="boardBody"></tbody>
    </table>
  </div>
  <div id="emptyMsg" class="empty-msg" style="display:none;">
    <span>📭</span> 暂无预约记录，快去预约吧！
  </div>
  <div style="text-align:right;margin-top:12px;font-size:12px;color:#999;">
    共 <span id="recordCount">0</span> 条记录 &nbsp;|&nbsp; 桂林山水职业学院联勤保障部
  </div>
</div>

<script>
// ============================================================
//  数据层
// ============================================================
const STORAGE_KEY = 'gs_vehicle_bookings';

function getRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}

function saveRecords(arr) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}

function generateId() {
  return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,6);
}

// 车辆列表
const VEHICLES = [
  { label: '埃安 桂CD31783', type: 'aion' },
  { label: '威马 桂CD56337', type: 'wm' },
];

// ============================================================
//  Toast 提示
// ============================================================
function toast(msg, type = 'success') {
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ============================================================
//  确认弹窗
// ============================================================
let confirmCallback = null;
function openConfirm(msg, cb) {
  document.getElementById('confirmMsg').textContent = msg;
  document.getElementById('confirmModal').classList.add('show');
  confirmCallback = cb;
}
function closeConfirm() {
  document.getElementById('confirmModal').classList.remove('show');
  confirmCallback = null;
}
document.getElementById('confirmBtn').onclick = function() {
  if (confirmCallback) confirmCallback();
  closeConfirm();
};
document.getElementById('confirmModal').onclick = function(e) {
  if (e.target === this) closeConfirm();
};

// ============================================================
//  提交预约
// ============================================================
document.getElementById('bookingForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const vehicle    = document.getElementById('vehicle').value;
  const useTime    = document.getElementById('useTime').value;
  const returnTime = document.getElementById('returnTime').value;
  const destination = document.getElementById('destination').value.trim();
  const borrower   = document.getElementById('borrower').value.trim();
  const driver     = document.getElementById('driver').value.trim();
  const driverPhone = document.getElementById('driverPhone').value.trim();
  const carpool = [
    document.getElementById('carpool1').value.trim(),
    document.getElementById('carpool2').value.trim(),
    document.getElementById('carpool3').value.trim(),
    document.getElementById('carpool4').value.trim(),
  ].filter(Boolean);

  // 校验
  if (!vehicle) { toast('请选择车辆', 'error'); return; }
  if (!useTime) { toast('请选择用车时间', 'error'); return; }
  if (!returnTime) { toast('请选择预计还车时间', 'error'); return; }
  if (new Date(returnTime) <= new Date(useTime)) {
    toast('预计还车时间必须晚于用车时间', 'error'); return;
  }
  if (!destination) { toast('请输入目的地', 'error'); return; }
  if (!borrower) { toast('请输入借车人姓名', 'error'); return; }
  if (!driver) { toast('请输入驾驶员姓名', 'error'); return; }
  if (!/^1\d{10}$/.test(driverPhone)) { toast('请输入正确的11位手机号码', 'error'); return; }

  // 时间冲突检测
  const records = getRecords();
  const conflict = records.some(r => {
    if (r.vehicle !== vehicle) return false;
    const rStart = new Date(r.useTime).getTime();
    const rEnd   = new Date(r.returnTime).getTime();
    const nStart = new Date(useTime).getTime();
    const nEnd   = new Date(returnTime).getTime();
    return nStart < rEnd && nEnd > rStart;
  });
  if (conflict) {
    toast(`⚠️ "${vehicle}" 在该时段已有预约，请调整时间`, 'error');
    return;
  }

  // 生成记录
  const record = {
    id: generateId(),
    vehicle,
    useTime,
    returnTime,
    destination,
    borrower,
    driver,
    driverPhone,
    carpool,
    status: '已预约',
    createdAt: new Date().toISOString(),
  };

  records.push(record);
  saveRecords(records);
  refreshAll();
  toast('✅ 预约提交成功！');
  resetForm();
});

function resetForm() {
  document.getElementById('bookingForm').reset();
  // datetime-local 留空
  document.getElementById('useTime').value = '';
  document.getElementById('returnTime').value = '';
}

// ============================================================
//  删除记录
// ============================================================
function deleteRecord(id) {
  openConfirm('确定要删除该条预约记录吗？删除后不可恢复。', function() {
    let records = getRecords();
    records = records.filter(r => r.id !== id);
    saveRecords(records);
    refreshAll();
    toast('🗑️ 记录已删除');
  });
}

// ============================================================
//  渲染看板
// ============================================================
function renderBoard() {
  let records = getRecords();
  const fV = document.getElementById('filterVehicle').value;
  const fD = document.getElementById('filterDate').value;

  if (fV) records = records.filter(r => r.vehicle === fV);
  if (fD) {
    records = records.filter(r => {
      const d = new Date(r.useTime);
      return d.toISOString().slice(0,10) === fD;
    });
  }

  // 按用车时间升序排列
  records.sort((a,b) => new Date(a.useTime) - new Date(b.useTime));

  const tbody = document.getElementById('boardBody');
  const empty = document.getElementById('emptyMsg');
  const count = document.getElementById('recordCount');

  if (records.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    count.textContent = '0';
    return;
  }
  empty.style.display = 'none';
  count.textContent = records.length;

  tbody.innerHTML = records.map((r, i) => {
    const vType = r.vehicle.startsWith('埃安') ? 'aion' : 'wm';
    const badgeClass = vType === 'aion' ? 'badge-aion' : 'badge-wm';
    const carpoolStr = r.carpool.length ? r.carpool.join('、') : '—';
    const statusHtml = `<span class="badge badge-status">${r.status}</span>`;

    return `<tr>
      <td>${i + 1}</td>
      <td><span class="badge ${badgeClass}">${r.vehicle}</span></td>
      <td>${formatDt(r.useTime)}</td>
      <td>${formatDt(r.returnTime)}</td>
      <td>${escHtml(r.destination)}</td>
      <td>${escHtml(r.borrower)}</td>
      <td>${escHtml(r.driver)}</td>
      <td>${escHtml(r.driverPhone)}</td>
      <td style="font-size:12px;">${escHtml(carpoolStr)}</td>
      <td>${statusHtml}</td>
      <td>
        <button class="del-btn" onclick="deleteRecord('${r.id}')" title="删除">✕</button>
      </td>
    </tr>`;
  }).join('');
}

function formatDt(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ============================================================
//  统计
// ============================================================
function renderStats() {
  const records = getRecords();
  const now = new Date();

  // 按车辆统计近期（本月）
  const thisMonth = records.filter(r => {
    const d = new Date(r.useTime);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  });

  const aionCount = thisMonth.filter(r => r.vehicle.includes('埃安')).length;
  const wmCount   = thisMonth.filter(r => r.vehicle.includes('威马')).length;

  // 当前在用
  const inUse = records.filter(r => {
    const start = new Date(r.useTime);
    const end   = new Date(r.returnTime);
    return start <= now && end >= now;
  });

  // 今日预约
  const today = now.toISOString().slice(0,10);
  const todayCount = records.filter(r => new Date(r.useTime).toISOString().slice(0,10) === today).length;

  document.getElementById('statsArea').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;text-align:center;">
      <div style="background:var(--primary-bg);padding:12px;border-radius:8px;">
        <div style="font-size:24px;font-weight:700;color:var(--primary);">${todayCount}</div>
        <div style="font-size:12px;color:#666;">今日预约</div>
      </div>
      <div style="background:#fef9e7;padding:12px;border-radius:8px;">
        <div style="font-size:24px;font-weight:700;color:var(--accent);">${inUse.length}</div>
        <div style="font-size:12px;color:#666;">当前在使用</div>
      </div>
      <div style="background:#fdedec;padding:12px;border-radius:8px;">
        <div style="font-size:24px;font-weight:700;color:var(--danger);">${records.length}</div>
        <div style="font-size:12px;color:#666;">总记录数</div>
      </div>
    </div>
  `;

  document.getElementById('statAionInfo').textContent = `本月预约：${aionCount} 次`;
  document.getElementById('statWmInfo').textContent  = `本月预约：${wmCount} 次`;
}

// ============================================================
//  筛选
// ============================================================
function applyFilters() {
  renderBoard();
}
function clearFilters() {
  document.getElementById('filterVehicle').value = '';
  document.getElementById('filterDate').value = '';
  renderBoard();
}

// ============================================================
//  导出 Excel
// ============================================================
function exportXlsx() {
  const records = getRecords();
  if (records.length === 0) { toast('暂无记录可导出', 'info'); return; }
  doExport(records, '车辆预约记录');
}

function exportAllXlsx() {
  const records = getRecords();
  if (records.length === 0) { toast('暂无记录可导出', 'info'); return; }
  doExport(records, '全部车辆预约记录');
}

function doExport(data, sheetName) {
  const rows = data.map((r, i) => ({
    '序号': i + 1,
    '车辆': r.vehicle,
    '用车时间': r.useTime ? new Date(r.useTime).toLocaleString('zh-CN', { hour12: false }) : '',
    '预计还车时间': r.returnTime ? new Date(r.returnTime).toLocaleString('zh-CN', { hour12: false }) : '',
    '目的地': r.destination,
    '借车人': r.borrower,
    '驾驶员': r.driver,
    '驾驶员手机': r.driverPhone,
    '拼车人': r.carpool.length ? r.carpool.join('、') : '',
    '状态': r.status,
    '创建时间': r.createdAt ? new Date(r.createdAt).toLocaleString('zh-CN', { hour12: false }) : '',
  }));

  const ws = XLSX.utils.json_to_sheet(rows);

  // 列宽
  ws['!cols'] = [
    { wch:5 }, { wch:16 }, { wch:18 }, { wch:18 },
    { wch:20 }, { wch:10 }, { wch:10 }, { wch:14 },
    { wch:20 }, { wch:8 }, { wch:18 },
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);

  const now = new Date();
  const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  const filename = `公车预约记录_${stamp}.xlsx`;

  XLSX.writeFile(wb, filename);
  toast(`📥 已导出：${filename}`);
}

// ============================================================
//  主刷新
// ============================================================
function refreshAll() {
  renderBoard();
  renderStats();
}

// ============================================================
//  键盘快捷键
// ============================================================
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeConfirm();
});

// ============================================================
//  启动
// ============================================================
refreshAll();
</script>
